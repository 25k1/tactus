name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "Tag $env:TAG is not a version like v1.2.3" }
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version = "[^"]*"', "version = `"$($Matches[1])`"" | Set-Content Cargo.toml -NoNewline
          cargo update --workspace
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: tactus
          path: target/release/tactus.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: tactus
          path: dist
      - name: Write the release notes
        run: |
          git fetch --force --tags --quiet
          filter=--exclude-pre-releases
          if [[ "$TAG" == *-* ]]; then filter=; fi
          previous=
          for tag in $(gh release list --exclude-drafts $filter --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "$TAG" ] && git merge-base --is-ancestor "$tag" "$TAG" 2>/dev/null; then
              previous=$tag
              break
            fi
          done
          git log --no-merges --reverse --pretty='format:- %s' "${previous:+$previous..}$TAG" > notes.md
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
      - name: Publish
        run: |
          zip -j "dist/tactus-$TAG-windows-x64.zip" dist/tactus.exe README.md LICENSE
          options=()
          if [[ "$TAG" == *-* ]]; then options+=(--prerelease); fi
          if [ -n "$PREVIOUS" ]; then options+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" dist/* --title "Tactus $TAG" --notes-file notes.md --generate-notes --verify-tag "${options[@]}"
