name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "Tag $env:TAG is not a version like v1.2.3" }
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version = "[^"]*"', "version = `"$($Matches[1])`"" | Set-Content Cargo.toml -NoNewline
          cargo update --workspace
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: tactus
          path: target/release/tactus.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: tactus
          path: dist
      - name: Write the release notes
        run: |
          git fetch --force --tags --quiet
          message=""
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
            message=$(git tag -l "$TAG" --format='%(contents:subject)%0a%0a%(contents:body)')
          fi
          if [ -n "$message" ] && [ "$message" != "$TAG" ]; then
            printf '%s\n' "$message" > notes.md
          else
            if previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null); then range="$previous..$TAG"; else range="$TAG"; fi
            git log --no-merges --reverse --pretty='format:- %s' "$range" > notes.md
          fi
      - name: Publish
        run: |
          zip -j "dist/tactus-$TAG-windows-x64.zip" dist/tactus.exe README.md LICENSE
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --title "Tactus $TAG" --notes-file notes.md --generate-notes --verify-tag "${prerelease[@]}"
