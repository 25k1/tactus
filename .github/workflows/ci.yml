name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check the version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq tactus | ForEach-Object version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match version $version" }
      - run: cargo build --release --locked
      - name: Publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/tactus.exe dist/
          Compress-Archive -Path target/release/tactus.exe, README.md, LICENSE -DestinationPath "dist/tactus-$env:TAG-windows-x64.zip"
          gh release create $env:TAG (Get-ChildItem dist).FullName --title "Tactus $env:TAG" --generate-notes --verify-tag
