name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  LIBCLANG_PATH: C:\Program Files\LLVM\bin

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/version
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: tactus
          path: target/release/tactus.exe

  winamp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: ./.github/actions/msvc
        with:
          arch: amd64_x86
      - uses: ilammy/setup-nasm@v1
      - uses: ./.github/actions/version
      - uses: Swatinem/rust-cache@v2
        with:
          key: winamp
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --profile plugin --locked --target i686-pc-windows-msvc -p tactus-winamp-in -p tactus-winamp-gen
      - uses: actions/upload-artifact@v7
        with:
          name: winamp
          path: |
            target/i686-pc-windows-msvc/plugin/in_yandex.dll
            target/i686-pc-windows-msvc/plugin/gen_yandex.dll

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build, winamp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: tactus
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: winamp
          path: winamp
      - name: Write the release notes
        run: |
          git fetch --force --tags --quiet
          filter=--exclude-pre-releases
          if [[ "$TAG" == *-* ]]; then filter=; fi
          previous=
          for tag in $(gh release list --exclude-drafts $filter --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "$TAG" ] && git merge-base --is-ancestor "$tag" "$TAG" 2>/dev/null; then
              previous=$tag
              break
            fi
          done
          git log --no-merges --reverse --pretty='format:- %s' "${previous:+$previous..}$TAG" > notes.md
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
      - name: Publish
        run: |
          zip -j "dist/tactus-$TAG-windows-x64.zip" dist/tactus.exe README.md LICENSE
          zip -j "dist/tactus-$TAG-winamp-plugins.zip" winamp/in_yandex.dll winamp/gen_yandex.dll README.md LICENSE
          options=()
          if [[ "$TAG" == *-* ]]; then options+=(--prerelease); fi
          if [ -n "$PREVIOUS" ]; then options+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" dist/* --title "Tactus $TAG" --notes-file notes.md --generate-notes --verify-tag "${options[@]}"
