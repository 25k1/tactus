[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unit_bindings = "warn"

[workspace.lints.clippy]
large_enum_variant = "allow"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
if_not_else = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
needless_continue = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"

[workspace.dependencies]
tactus-api = { path = "crates/tactus-api" }
tactus-core = { path = "crates/tactus-core" }
tactus-voice = { path = "crates/tactus-voice" }
yandex-music = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "system-proxy", "json", "form", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "flac"] }
sonic-rs-sys = "0.1.9"
souvlaki = { version = "0.8", default-features = false }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
httparse = { version = "1", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }

[package]
name = "tactus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tactus-api.workspace = true
tactus-core.workspace = true
serde_json.workspace = true
wxdragon = { version = "0.9.23", default-features = false }
prismer = { version = "0.1.4", features = ["static"] }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
fake = ["tactus-api/fake"]

[dev-dependencies]
tactus-api = { workspace = true, features = ["fake"] }
proptest.workspace = true

[lints]
workspace = true

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package]
rodio.opt-level = 3
cpal.opt-level = 3
dasp_sample.opt-level = 3
sonic-rs-sys.opt-level = 3
symphonia-core.opt-level = 3
symphonia-bundle-mp3.opt-level = 3
symphonia-bundle-flac.opt-level = 3
